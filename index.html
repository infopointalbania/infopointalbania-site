<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoPoint Albania</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:#000;
        }

        /* Flamuri shqiptar në gjithë ekranin */
        .flag-bg{
            position:fixed;
            inset:0;
            background-image:url("https://upload.wikimedia.org/wikipedia/commons/3/36/Flag_of_Albania.svg");
            background-size:cover;
            background-position:center;
            opacity:0.25;
            animation:wave 6s infinite ease-in-out;
            z-index:0;
        }

        /* shtresë e errët për lexim më të mirë */
        .overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.25);
            z-index:1;
        }

        .box{
            text-align:center;
            position:relative;
            z-index:2;
            color:white;
        }

        h1{
            color:#d62828;
            font-size:48px;
            text-shadow:2px 2px 5px #000;
        }

        p{
            font-size:20px;
            color:white;
            text-shadow:2px 2px 5px #000;
        }

        @keyframes wave{
            0%{
                transform:scale(1) skewX(0deg);
            }
            50%{
                transform:scale(1.08) skewX(3deg);
            }
            100%{
                transform:scale(1) skewX(0deg);
            }
        }

    </style>
</head>

<body>

<div class="flag-bg"></div>
<div class="overlay"></div>

<div class="box">
    <h1>🇦🇱 InfoPoint Albania</h1>
    <p>Website is under construction.</p>
</div>

</body>
</html>
